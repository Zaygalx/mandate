services:
  - type: web
    name: mandate
    runtime: node
    plan: starter
    region: oregon
    buildCommand: echo "no build step, zero dependencies"
    startCommand: node src/server.mjs
    healthCheckPath: /api/state
    envVars:
      - key: NODE_VERSION
        value: 24.11.0
      - key: PAYPAL_MODE
        value: mock
      - key: MANDATE_DB
        value: /var/data/mandate.db
      - key: MANDATE_SEED_DEMO
        value: "1"
    disk:
      name: mandate-data
      mountPath: /var/data
      sizeGB: 1
